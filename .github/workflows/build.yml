# Builds the firmware of this LoRaWAN node (Radioenge EndDevice module: STM32L071CZ + SX1272)
# with CMake + arm-none-eabi-gcc, and publishes the web page (web/index.html) on GitHub Pages.
#
#   push / pull request -> .hex/.bin/.elf as workflow artifacts, version from "git describe"
#                          (e.g. 0.0.1-3-gabc1234)
#   tag vX.Y.Z          -> GitHub Release "vX.Y.Z" with the files of version X.Y.Z
#   tag vX.Y.Z-rc1      -> same, marked as pre-release
#   push to main/master -> web page at https://<user>.github.io/<repository>/
#
# The version written into the firmware (NODE_FW_VERSION: boot banner, "info", web page and app)
# comes from the tag through FW_VERSION (CMakeLists.txt): nothing to edit by hand.
# Same build as on the PC: sh scripts/build.sh build.
name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PKG: ${{ github.event.repository.name }}   # prefix of the release files (= repository name)

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # tags and history for git describe

      - id: v
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::tag '$tag' is not vMAJOR.MINOR.PATCH (e.g. v0.0.1 or v0.1.0-rc1)"
              exit 1
            fi
            ver="${tag#v}"
            release=true
            case "$ver" in *-*) pre=true ;; *) pre=false ;; esac
          else
            ver=$(git describe --tags --match 'v[0-9]*' 2>/dev/null || true)
            ver="${ver#v}"
            [ -n "$ver" ] || ver="0.0.0-dev+$(git rev-parse --short HEAD)"
            release=false
            pre=false
          fi
          echo "version=$ver"       >> "$GITHUB_OUTPUT"
          echo "release=$release"   >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre"    >> "$GITHUB_OUTPUT"
          echo "### Firmware version: \`$ver\`" >> "$GITHUB_STEP_SUMMARY"

  firmware:
    needs: version
    runs-on: ubuntu-latest
    env:
      FW_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      # Toolchain without apt: the Ubuntu mirror of the runner (azure.archive.ubuntu.com) fails
      # from time to time ("Temporary failure resolving") and broke the build with exit code 100.
      # Arm GNU Toolchain 13.2.Rel1 (same GCC as Ubuntu 24.04's gcc-arm-none-eabi, with newlib and
      # nano.specs) comes from developer.arm.com and stays in the runner's tool cache; CMake and
      # Ninja come from their GitHub releases.
      - name: Toolchain (arm-none-eabi-gcc)
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'

      - name: Toolchain (CMake + Ninja)
        uses: lukka/get-cmake@latest

      - name: Toolchain versions
        run: |
          arm-none-eabi-gcc --version | head -1
          cmake --version | head -1
          ninja --version

      - name: Build
        shell: bash
        run: |
          sh scripts/build.sh build 2>&1 | tee build.log
          fw=$(ls build/*.elf | head -1)
          {
            echo "### $(basename "$fw" .elf)"
            echo '```'
            arm-none-eabi-gcc --version | head -1
            arm-none-eabi-size "$fw"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Codec ADAILSILVA_V1 (doc/codec/teste_codec.js)
        shell: bash
        run: node doc/codec/teste_codec.js

      - name: Package
        shell: bash
        run: |
          fw=$(basename "$(ls build/*.elf | head -1)" .elf)
          mkdir -p dist
          for x in hex bin elf; do cp "build/$fw.$x" "dist/$PKG-$FW_VERSION.$x"; done
          ls -l dist

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PKG }}-${{ needs.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and release notes
        shell: bash
        run: |
          cd dist && sha256sum ./* | sed 's| \./| |' > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          : > notes.md
          for f in CHANGELOG.md doc/CHANGELOG.md; do
            [ -f "$f" ] || continue
            awk -v v="## v$VERSION" '
              index($0, v) == 1 { on = 1; next }
              on && /^(## |---)/ { exit }
              on { print }' "$f" > notes.md
            break
          done
          [ -s notes.md ] || echo "Firmware v$VERSION" > notes.md
          cat >> notes.md <<EOF

          ### Arquivos
          | Arquivo | Para |
          |---|---|
          | \`$PKG-$VERSION.hex\` | gravar com o STM32CubeProgrammer, OpenOCD ou st-flash (endereços dentro do arquivo) |
          | \`$PKG-$VERSION.bin\` | gravar em \`0x08000000\` |
          | \`$PKG-$VERSION.elf\` | depurar (símbolos) |

          Módulo Radioenge LoRaWAN EndDevice (STM32L071CZ + SX1272), AU915, LoRaMac-node v4.7.1, Classes A/B/C.
          Gravar só o firmware **mantém a EEPROM** (configuração, sessão, FCnt e DevNonce).

          \`\`\`bash
          # 1ª vez em cada módulo: tira a proteção de leitura (APAGA o firmware AT de fábrica)
          STM32_Programmer_CLI -c port=SWD mode=UR reset=HWrst -ob RDP=0xAA
          # gravar
          STM32_Programmer_CLI -c port=SWD mode=UR reset=HWrst -w $PKG-$VERSION.hex -v -rst
          \`\`\`
          EOF

      - uses: softprops/action-gh-release@v3
        with:
          name: v${{ env.VERSION }}
          body_path: notes.md
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          files: dist/*

  pages:
    # web page (web/index.html): Web Serial / Web Bluetooth need https, which GitHub Pages gives
    if: github.event_name == 'push' && github.ref_type == 'branch'
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        continue-on-error: true      # Pages turned off: the firmware build still passes
        id: cfg
      - uses: actions/upload-pages-artifact@v4
        if: steps.cfg.outcome == 'success'
        with:
          path: web
      - uses: actions/deploy-pages@v4
        if: steps.cfg.outcome == 'success'
        id: deploy
