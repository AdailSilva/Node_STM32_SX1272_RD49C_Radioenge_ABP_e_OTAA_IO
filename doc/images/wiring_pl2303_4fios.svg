<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="DejaVu Sans, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="1200" height="840" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#14211d">Cabo USB-serial PL2303 (4 fios) no módulo Radioenge</text>
  <text x="600" y="70" text-anchor="middle" font-size="15" fill="#5b6a64">Console 115200 8N1 · TX e RX cruzados · pinos vistos de cima, antena SMA para cima</text>

  <!-- ===================== passos ===================== -->
  <g font-size="14" fill="#14211d">
    <text x="40" y="150" font-size="17" font-weight="700" fill="#0b7a5f">Passo a passo</text>
    <text x="40" y="182" font-weight="700">1. Cabo fora do USB</text>
    <text x="40" y="216" font-weight="700">2.</text><text x="80" y="216" font-weight="700">Preto → pino 1 (GND)</text>
    <text x="40" y="250" font-weight="700">3.</text><text x="80" y="250" font-weight="700">Verde → pino 2 (RX)</text>
    <text x="58" y="270" fill="#5b6a64">TX do cabo → RX PB7</text>
    <text x="40" y="304" font-weight="700">4.</text><text x="80" y="304" font-weight="700">Branco → pino 3 (TX)</text>
    <text x="58" y="324" fill="#5b6a64">RX do cabo ← TX PB6</text>
    <text x="40" y="358" font-weight="700">5.</text><text x="80" y="358" font-weight="700">Vermelho → pino 4 (VCC)</text>
    <text x="58" y="378" fill="#5b6a64">5 V; regulador aceita 4–12 V</text>
    <circle cx="65" cy="211" r="7" fill="#222222"/>
    <circle cx="65" cy="245" r="7" fill="#2e9e45"/>
    <circle cx="65" cy="299" r="7" fill="#f7f7f7" stroke="#7d858c" stroke-width="1.5"/>
    <circle cx="65" cy="353" r="7" fill="#c0362c"/>
    <text x="40" y="412" font-weight="700">6. Antena no SMA</text>
    <text x="40" y="446" font-weight="700">7. Cabo no USB do PC</text>
    <text x="58" y="466" fill="#5b6a64">Linux: /dev/ttyUSB0</text>
    <text x="40" y="500" font-weight="700">8. build.sh monitor</text>
    <text x="58" y="520" fill="#5b6a64">Enter → prompt  &gt;</text>
  </g>

  <!-- ===================== módulo ===================== -->
  <g transform="translate(330,170)">
    <rect x="0" y="0" width="300" height="470" rx="12" fill="#1f3f8f" stroke="#0e2a6b" stroke-width="3"/>
    <rect x="95" y="-58" width="70" height="70" rx="6" fill="#d6b25e" stroke="#9c7b2f" stroke-width="2"/>
    <text x="130" y="-14" text-anchor="middle" font-size="13" fill="#3d2f0c">SMA</text>
    <rect x="95" y="150" width="110" height="110" rx="6" fill="#2b2b2b"/>
    <text x="150" y="200" text-anchor="middle" font-size="13" fill="#e6e6e6">STM32</text>
    <text x="150" y="218" text-anchor="middle" font-size="13" fill="#e6e6e6">L071CZ</text>
    <rect x="110" y="70" width="80" height="60" rx="4" fill="#2b2b2b"/>
    <text x="150" y="105" text-anchor="middle" font-size="13" fill="#e6e6e6">SX1272</text>
    <text x="150" y="300" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="700" transform="translate(-35,0)">RADIOENGE</text>
    <text x="150" y="318" text-anchor="middle" font-size="12" fill="#c9d6ff" transform="translate(-35,0)">LoRaWAN EndDevice</text>

    <circle cx="70" cy="360" r="8" fill="#e04848"/><text x="70" y="388" text-anchor="middle" font-size="11" fill="#ffffff">PB5</text>
    <circle cx="105" cy="360" r="8" fill="#3fbf55"/><text x="105" y="388" text-anchor="middle" font-size="11" fill="#ffffff">PB8</text>
    <circle cx="140" cy="360" r="8" fill="#f2c230"/><text x="140" y="388" text-anchor="middle" font-size="11" fill="#ffffff">PB9</text>

    <g font-size="14" fill="#ffffff">
      <circle cx="300" cy="60"  r="9" fill="#e9c46a" stroke="#8a6d1d"/><text x="282" y="65"  text-anchor="end" fill="#9fb0d8">8 GND</text>
      <circle cx="300" cy="110" r="9" fill="#e9c46a" stroke="#8a6d1d"/><text x="282" y="115" text-anchor="end" fill="#9fb0d8">7 GPIO1 PA2</text>
      <circle cx="300" cy="160" r="9" fill="#e9c46a" stroke="#8a6d1d"/><text x="282" y="165" text-anchor="end" fill="#9fb0d8">6 GPIO0 PA3</text>
      <circle cx="300" cy="210" r="9" fill="#e9c46a" stroke="#8a6d1d"/><text x="282" y="215" text-anchor="end" fill="#9fb0d8">5 VCC</text>
      <circle cx="300" cy="260" r="9" fill="#e9c46a" stroke="#8a6d1d"/><text x="282" y="265" text-anchor="end" font-weight="700">4 VCC</text>
      <circle cx="300" cy="310" r="9" fill="#e9c46a" stroke="#8a6d1d"/><text x="282" y="315" text-anchor="end" font-weight="700">3 TX PB6</text>
      <circle cx="300" cy="360" r="9" fill="#e9c46a" stroke="#8a6d1d"/><text x="282" y="365" text-anchor="end" font-weight="700">2 RX PB7</text>
      <circle cx="300" cy="410" r="9" fill="#e9c46a" stroke="#8a6d1d"/><text x="282" y="415" text-anchor="end" font-weight="700">1 GND</text>
    </g>
    <g font-size="13" fill="#ffffff">
      <circle cx="60"  cy="470" r="9" fill="#e9c46a" stroke="#8a6d1d"/>
      <circle cx="120" cy="470" r="9" fill="#e9c46a" stroke="#8a6d1d"/>
      <circle cx="180" cy="470" r="9" fill="#e9c46a" stroke="#8a6d1d"/>
      <circle cx="240" cy="470" r="9" fill="#e9c46a" stroke="#8a6d1d"/>
      <text x="60"  y="452" text-anchor="middle">SWDIO</text>
      <text x="120" y="452" text-anchor="middle">GND</text>
      <text x="180" y="452" text-anchor="middle">SWCLK</text>
      <text x="240" y="452" text-anchor="middle">RESET</text>
    </g>
  </g>

  <!-- ===================== fios do cabo ===================== -->
  <!-- trechos do conector dupont até o corpo do cabo (convergem) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M890 430 C950 430 960 495 1010 495" stroke="#c0362c" stroke-width="6"/>
    <path d="M890 480 C950 480 960 502 1010 502" stroke="#7d858c" stroke-width="8"/>
    <path d="M890 480 C950 480 960 502 1010 502" stroke="#f7f7f7" stroke-width="5"/>
    <path d="M890 530 C950 530 960 509 1010 509" stroke="#2e9e45" stroke-width="6"/>
    <path d="M890 580 C950 580 960 516 1010 516" stroke="#222222" stroke-width="6"/>
  </g>
  <!-- trechos do pino do módulo até o dupont -->
  <g fill="none" stroke-linecap="round">
    <path d="M639 430 L860 430" stroke="#c0362c" stroke-width="6"/>
    <path d="M639 480 L860 480" stroke="#7d858c" stroke-width="8"/>
    <path d="M639 480 L860 480" stroke="#f7f7f7" stroke-width="5"/>
    <path d="M639 530 L860 530" stroke="#2e9e45" stroke-width="6"/>
    <path d="M639 580 L860 580" stroke="#222222" stroke-width="6"/>
  </g>
  <!-- conectores dupont fêmea -->
  <g stroke="#111" stroke-width="1.5">
    <rect x="842" y="420" width="50" height="20" rx="3" fill="#c0362c"/>
    <rect x="842" y="470" width="50" height="20" rx="3" fill="#f7f7f7"/>
    <rect x="842" y="520" width="50" height="20" rx="3" fill="#2e9e45"/>
    <rect x="842" y="570" width="50" height="20" rx="3" fill="#333333"/>
  </g>
  <!-- rótulos dos fios -->
  <g font-size="13" font-weight="700" fill="#14211d">
    <text x="652" y="420">Vermelho · +5 V</text>
    <text x="652" y="470">Branco · RXD do cabo</text>
    <text x="652" y="520">Verde · TXD do cabo</text>
    <text x="652" y="570">Preto · GND</text>
  </g>

  <!-- corpo do cabo PL2303 (plugue USB azul) -->
  <g transform="translate(1010,470)">
    <rect x="0" y="0" width="110" height="70" rx="10" fill="#2a6fd6" stroke="#174a99" stroke-width="3"/>
    <text x="55" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">PL2303</text>
    <text x="55" y="52" text-anchor="middle" font-size="11" fill="#dbe8ff">USB-TTL</text>
    <rect x="110" y="15" width="50" height="40" rx="3" fill="#c9ced3" stroke="#7d858c" stroke-width="2"/>
    <rect x="120" y="25" width="30" height="20" fill="#9aa1a8"/>
    <text x="80" y="95" text-anchor="middle" font-size="12" fill="#5b6a64">→ USB do PC</text>
  </g>

  <!-- ===================== avisos ===================== -->
  <g transform="translate(40,680)">
    <rect x="0" y="0" width="1120" height="140" rx="12" fill="#fff7e6" stroke="#c27803" stroke-width="3"/>
    <text x="20" y="32" font-size="18" font-weight="700" fill="#8a5300">Atenção</text>
    <text x="20" y="60" font-size="14" fill="#14211d">• Sem nada no monitor? Troque o branco com o verde: alguns cabos vêm com as cores invertidas (não queima nada).</text>
    <text x="20" y="84" font-size="14" fill="#14211d">• Antes de ligar, meça o verde em relação ao preto, só com o cabo no USB: deve marcar ≈ 3,3 V em repouso.</text>
    <text x="20" y="108" font-size="14" fill="#14211d">• Com o ST-LINK ligado junto: GND comum e uma fonte só. Com o vermelho no VCC, deixe o 3,3 V do ST-LINK sem ligação.</text>
    <text x="20" y="130" font-size="14" fill="#5b6a64">• Usando fonte externa de 4–12 V no VCC, deixe o vermelho solto e mantenha o preto (GND) ligado.</text>
  </g>
</svg>
