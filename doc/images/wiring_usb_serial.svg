<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="DejaVu Sans, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="1200" height="840" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#14211d">Adaptador USB-serial externo no módulo Radioenge (console)</text>
  <text x="600" y="70" text-anchor="middle" font-size="15" fill="#5b6a64">115200 8N1 · TX e RX cruzados · sinais em 3,3 V · pinos vistos de cima, antena SMA para cima</text>

  <!-- ===================== passos ===================== -->
  <g font-size="14" fill="#14211d">
    <text x="40" y="150" font-size="17" font-weight="700" fill="#0b7a5f">Passo a passo</text>
    <text x="40" y="182" font-weight="700">1. Jumper do adaptador em 3V3</text>
    <text x="58" y="202" fill="#5b6a64">(sinais TX/RX em 3,3 V)</text>
    <text x="40" y="234" font-weight="700">2. GND → pino 1</text>
    <text x="40" y="266" font-weight="700">3. TXD → pino 2 (RX)</text>
    <text x="40" y="298" font-weight="700">4. RXD → pino 3 (TX)</text>
    <text x="40" y="330" font-weight="700">5. 5V → pino 4 (VCC)</text>
    <text x="58" y="350" fill="#5b6a64">(ou fonte de 4–12 V)</text>
    <text x="40" y="382" font-weight="700">6. Pino 3V3 do adaptador</text>
    <text x="58" y="402" fill="#5b6a64">fica sem ligação</text>
    <text x="40" y="434" font-weight="700">7. Antena no SMA</text>
    <text x="40" y="466" font-weight="700">8. USB no PC ou no celular</text>
    <text x="58" y="486" fill="#5b6a64">(no celular, cabo OTG)</text>
  </g>

  <!-- ===================== módulo ===================== -->
  <g transform="translate(330,170)">
    <rect x="0" y="0" width="300" height="470" rx="12" fill="#1f3f8f" stroke="#0e2a6b" stroke-width="3"/>
    <rect x="95" y="-58" width="70" height="70" rx="6" fill="#d6b25e" stroke="#9c7b2f" stroke-width="2"/>
    <text x="130" y="-14" text-anchor="middle" font-size="13" fill="#3d2f0c">SMA</text>
    <rect x="95" y="150" width="110" height="110" rx="6" fill="#2b2b2b"/>
    <text x="150" y="200" text-anchor="middle" font-size="13" fill="#e6e6e6">STM32</text>
    <text x="150" y="218" text-anchor="middle" font-size="13" fill="#e6e6e6">L071CZ</text>
    <rect x="110" y="70" width="80" height="60" rx="4" fill="#2b2b2b"/>
    <text x="150" y="105" text-anchor="middle" font-size="13" fill="#e6e6e6">SX1272</text>
    <text x="150" y="300" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="700">RADIOENGE</text>
    <text x="150" y="318" text-anchor="middle" font-size="12" fill="#c9d6ff">LoRaWAN EndDevice</text>

    <circle cx="70" cy="360" r="8" fill="#e04848"/><text x="70" y="388" text-anchor="middle" font-size="11" fill="#ffffff">PB5</text>
    <circle cx="105" cy="360" r="8" fill="#3fbf55"/><text x="105" y="388" text-anchor="middle" font-size="11" fill="#ffffff">PB8</text>
    <circle cx="140" cy="360" r="8" fill="#f2c230"/><text x="140" y="388" text-anchor="middle" font-size="11" fill="#ffffff">PB9</text>

    <g font-size="14" fill="#ffffff">
      <circle cx="300" cy="60"  r="9" fill="#e9c46a" stroke="#8a6d1d"/><text x="282" y="65"  text-anchor="end">8 GND</text>
      <circle cx="300" cy="110" r="9" fill="#e9c46a" stroke="#8a6d1d"/><text x="282" y="115" text-anchor="end">7 GPIO1 PA2</text>
      <circle cx="300" cy="160" r="9" fill="#e9c46a" stroke="#8a6d1d"/><text x="282" y="165" text-anchor="end">6 GPIO0 PA3</text>
      <circle cx="300" cy="210" r="9" fill="#e9c46a" stroke="#8a6d1d"/><text x="282" y="215" text-anchor="end">5 VCC</text>
      <circle cx="300" cy="260" r="9" fill="#e9c46a" stroke="#8a6d1d"/><text x="282" y="265" text-anchor="end">4 VCC</text>
      <circle cx="300" cy="310" r="9" fill="#e9c46a" stroke="#8a6d1d"/><text x="282" y="315" text-anchor="end">3 TX PB6</text>
      <circle cx="300" cy="360" r="9" fill="#e9c46a" stroke="#8a6d1d"/><text x="282" y="365" text-anchor="end">2 RX PB7</text>
      <circle cx="300" cy="410" r="9" fill="#e9c46a" stroke="#8a6d1d"/><text x="282" y="415" text-anchor="end">1 GND</text>
    </g>
    <g font-size="13" fill="#ffffff">
      <circle cx="60"  cy="470" r="9" fill="#e9c46a" stroke="#8a6d1d"/>
      <circle cx="120" cy="470" r="9" fill="#e9c46a" stroke="#8a6d1d"/>
      <circle cx="180" cy="470" r="9" fill="#e9c46a" stroke="#8a6d1d"/>
      <circle cx="240" cy="470" r="9" fill="#e9c46a" stroke="#8a6d1d"/>
      <text x="60"  y="452" text-anchor="middle">SWDIO</text>
      <text x="120" y="452" text-anchor="middle">GND</text>
      <text x="180" y="452" text-anchor="middle">SWCLK</text>
      <text x="240" y="452" text-anchor="middle">RESET</text>
    </g>
  </g>

  <!-- ===================== adaptador USB-serial ===================== -->
  <g transform="translate(800,300)">
    <rect x="0" y="0" width="300" height="340" rx="12" fill="#f4f7f6" stroke="#0b7a5f" stroke-width="3"/>
    <text x="20" y="32" font-size="20" font-weight="700" fill="#0b7a5f">Adaptador USB-serial</text>
    <text x="20" y="54" font-size="13" fill="#5b6a64">CP2102 · CH340 · FTDI · PL2303</text>
    <g font-size="15" fill="#14211d">
      <circle cx="0" cy="70"  r="9" fill="#e9c46a" stroke="#8a6d1d"/><text x="20" y="75">5V</text><text x="62" y="75" font-size="12" fill="#5b6a64">vermelho</text>
      <circle cx="0" cy="120" r="9" fill="#d9dedc" stroke="#8aa69b"/><text x="20" y="125" fill="#8a9590">3V3 (não ligar)</text>
      <circle cx="0" cy="170" r="9" fill="#e9c46a" stroke="#8a6d1d"/><text x="20" y="175">TXD</text><text x="62" y="175" font-size="12" fill="#5b6a64">verde</text>
      <circle cx="0" cy="220" r="9" fill="#e9c46a" stroke="#8a6d1d"/><text x="20" y="225">RXD</text><text x="62" y="225" font-size="12" fill="#5b6a64">branco</text>
      <circle cx="0" cy="270" r="9" fill="#e9c46a" stroke="#8a6d1d"/><text x="20" y="275">GND</text><text x="62" y="275" font-size="12" fill="#5b6a64">preto</text>
    </g>
    <!-- jumper de nível -->
    <g transform="translate(120,150)">
      <text x="0" y="0" font-size="12" fill="#5b6a64">jumper de nível</text>
      <rect x="0" y="10" width="56" height="28" rx="5" fill="#0b7a5f"/><text x="28" y="29" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3V3</text>
      <rect x="62" y="10" width="56" height="28" rx="5" fill="#ffffff" stroke="#8aa69b"/><text x="90" y="29" text-anchor="middle" font-size="13" fill="#8a9590">5V</text>
    </g>
    <!-- conector USB -->
    <rect x="300" y="120" width="40" height="70" rx="4" fill="#c9ced3" stroke="#7d858c" stroke-width="2"/>
    <text x="320" y="160" text-anchor="middle" font-size="12" fill="#333" transform="rotate(90 320 156)">USB</text>
    <text x="20" y="302" font-size="12" fill="#5b6a64">Cores do cabo comum de 4 fios (PL2303).</text><text x="20" y="320" font-size="13" fill="#5b6a64">USB → PC ou celular (cabo OTG)</text>
  </g>

  <!-- ===================== fios ===================== -->
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <!-- 5V -> pino 4 VCC -->
    <path d="M639 430 L700 430 L700 370 L791 370" stroke="#c0362c"/>
    <!-- RXD <- pino 3 TX -->
    <path d="M639 480 L770 480 L770 520 L791 520" stroke="#7d858c" stroke-width="7"/><path d="M639 480 L770 480 L770 520 L791 520" stroke="#f7f7f7" stroke-width="4"/>
    <!-- TXD -> pino 2 RX -->
    <path d="M639 530 L740 530 L740 470 L791 470" stroke="#2e9e45"/>
    <!-- GND -> pino 1 -->
    <path d="M639 580 L720 580 L720 570 L791 570" stroke="#222222"/>
  </g>
  <g font-size="12" fill="#14211d">
    <text x="652" y="360">5 V → VCC</text>
    <text x="652" y="502">TX → RXD</text>
    <text x="652" y="550">RX ← TXD</text>
  </g>

  <!-- ===================== ST-LINK junto ===================== -->
  <g transform="translate(40,690)">
    <rect x="0" y="0" width="1120" height="120" rx="12" fill="#fff7e6" stroke="#c27803" stroke-width="3"/>
    <text x="20" y="32" font-size="18" font-weight="700" fill="#8a5300">ST-LINK V2 ligado ao mesmo tempo (gravar e usar o console sem desligar nada)</text>
    <text x="20" y="60" font-size="14" fill="#14211d">SWDIO, SWCLK, GND (e RST, opcional) nos pads de baixo do módulo. GND comum entre ST-LINK, adaptador e módulo.</text>
    <text x="20" y="84" font-size="14" fill="#14211d">Uma fonte só no VCC: com o 5 V do adaptador nos pinos 4/5, deixe o 3,3 V do ST-LINK sem ligação.</text>
    <text x="20" y="108" font-size="14" fill="#5b6a64">O ST-LINK V2 não tem porta serial: a página WEB e o app sempre usam o adaptador (ou um módulo BLE).</text>
  </g>
</svg>
